[toolchain]
# The one toolchain everything builds with: `cargo` here, ci.yml (through
# actions-rust-lang/setup-rust-toolchain, which reads this file), and the bundle and
# release workflows (setup-tauri installs this channel). It must be at least 1.90 for
# Tauri 2.12 and 1.88 for Leptos 0.8. `rust-version` in Cargo.toml is the floor the crates
# declare, not a number to keep equal to this channel, and nothing checks it: the
# workspace is never published.
channel = "1.97.1"
components = ["rustfmt", "clippy"]
targets = ["wasm32-unknown-unknown"]
