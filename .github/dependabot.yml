version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    pull-request-branch-name:
      separator: "-"
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    commit-message:
      prefix: "deps(cargo): "
    groups:
      tauri:
        patterns:
          - "tauri"
          - "tauri-*"
          - "wry"
          - "tao"
      wasm:
        patterns:
          - "wasm-bindgen*"
          - "js-sys"
          - "web-sys"
          - "leptos*"
      # Everything else. The exclude list mirrors the two groups above so that
      # a tauri or wasm crate never lands in this catch-all pull request:
      # change the three lists together.
      rust-other:
        patterns:
          - "*"
        exclude-patterns:
          - "tauri"
          - "tauri-*"
          - "wry"
          - "tao"
          - "wasm-bindgen*"
          - "js-sys"
          - "web-sys"
          - "leptos*"

  - package-ecosystem: github-actions
    directory: "/"
    pull-request-branch-name:
      separator: "-"
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    commit-message:
      prefix: "deps(actions): "
    groups:
      actions:
        patterns:
          - "*"

  # The Prometheus and Grafana images of the observability stack (docs/GRAFANA.md).
  - package-ecosystem: docker-compose
    directory: /docs/observability
    pull-request-branch-name:
      separator: "-"
    schedule:
      interval: monthly
    commit-message:
      prefix: "deps(compose): "
    groups:
      observability:
        patterns:
          - "*"
