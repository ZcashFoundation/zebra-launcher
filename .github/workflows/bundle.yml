# Unsigned bundles with real stable, beta and nightly zebrads on all five
# targets, so a broken build or bundle shows up before release day. Runs on
# every push to `main`, weekly, and on dispatch.
#
# - sidecars: three zebrad-sidecars.yml calls upload zebrad-<channel>-<triple>
#   artifacts at the exact channel pins.
# - docs: zebrad-docs.yml renders the offline book, config and changes for all
#   channels after every sidecar job succeeds.
# - bundle: `cargo tauri build` per target with all sidecars and docs, then on
#   Linux a glibc floor check, and on Linux x86_64 an install smoke test of the
#   .deb and the AppImage under Xvfb.
#
# Nothing here is signed and no secrets are used: macOS bundles are ad-hoc
# signed, updater artifacts are disabled, Windows binaries are unsigned. The
# signed pipeline is release.yml.
#
# Development builds (dispatch only): `zebrad_ref` replaces stable with that
# Zebra branch, tag or full commit SHA; beta and nightly remain pinned. `targets`
# selects bundle targets, with Linux x86_64 added to sidecar builds for docs.
# Artifacts hold the bundles, raw launcher and all sidecars, plus build info.
# Only custom stable is exempt from the glibc floor, and Linux smoke tests run
# only if it runs in the ubuntu:22.04 container. Such builds are never released.
# See docs/SIDECARS.md, "Development builds from a Zebra git ref".
#
# Callers of workflow_call must grant contents: read, actions: read (same-run
# sidecar and docs artifacts), id-token: write and attestations: write.
name: Bundle

on:
  workflow_dispatch:
    inputs:
      zebrad_ref:
        description: DEVELOPMENT BUILD, never released. Zebra branch, tag or full commit SHA for the stable sidecar (empty uses ZEBRAD_VERSION; beta and nightly stay pinned)
        required: false
        type: string
        default: ""
      targets:
        description: comma-separated target triples from .github/targets.json (empty builds all five)
        required: false
        type: string
        default: ""
  workflow_call:
    inputs:
      zebrad_ref:
        description: DEVELOPMENT BUILD, never released. Zebra branch, tag or full commit SHA for the stable sidecar (empty uses ZEBRAD_VERSION; beta and nightly stay pinned)
        required: false
        type: string
        default: ""
      targets:
        description: comma-separated target triples from .github/targets.json (empty builds all five)
        required: false
        type: string
        default: ""
  schedule:
    # Weekly, Monday 04:17 UTC, to catch Tier-3 zebrad build breakage early.
    - cron: "17 4 * * 1"
  push:
    branches: [main]

permissions: {}

concurrency:
  # A literal prefix: under workflow_call, github.workflow is the caller's name.
  # A development build gets its own group per ref and target selection, so it
  # neither cancels nor is cancelled by the regular run on the same branch.
  group: bundle-${{ github.ref }}${{ inputs.zebrad_ref && format('-dev-{0}-{1}', inputs.zebrad_ref, inputs.targets) || '' }}
  cancel-in-progress: true

# Tool pins, APP_BIN, GLIBC_FLOOR and LINUX_PACKAGES come from
# .github/tool-versions.env (loaded by the setup-tauri action); the target
# matrix from .github/targets.json. release.yml uses the same two files.
env:
  CARGO_TERM_COLOR: always
  CI: true

jobs:
  # ---------------------------------------------------------------------------
  # The target matrix, read once.
  # ---------------------------------------------------------------------------
  targets:
    name: Read the target matrix
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.targets.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The five-target matrix from .github/targets.json, or the targets the
      # `targets` input selects (the sidecars workflow selects the same).
      - id: targets
        name: Read the target matrix
        shell: bash
        env:
          INPUT_TARGETS: ${{ inputs.targets }}
        run: |
          set -euo pipefail
          matrix="$(scripts/select-targets.sh --targets "${INPUT_TARGETS}")"
          echo "${matrix}"
          echo "matrix=${matrix}" >> "${GITHUB_OUTPUT}"

  # ---------------------------------------------------------------------------
  # Three attested sidecar sets at their channel pins. A custom ref changes only
  # stable, whose development outputs are zebrad_ref/zebrad_commit instead of
  # version/commit. Targeted runs add Linux x86_64 for the docs generator.
  # ---------------------------------------------------------------------------
  sidecars:
    name: Stable zebrad sidecars
    permissions:
      contents: read
      id-token: write # sidecar build provenance
      attestations: write # sidecar build provenance
    uses: ./.github/workflows/zebrad-sidecars.yml
    with:
      channel: stable
      zebrad_ref: ${{ inputs.zebrad_ref || '' }}
      targets: ${{ inputs.targets && format('x86_64-unknown-linux-gnu,{0}', inputs.targets) || '' }}

  sidecars-beta:
    name: Beta zebrad sidecars
    permissions:
      contents: read
      id-token: write # sidecar build provenance
      attestations: write # sidecar build provenance
    uses: ./.github/workflows/zebrad-sidecars.yml
    with:
      channel: beta
      targets: ${{ inputs.targets && format('x86_64-unknown-linux-gnu,{0}', inputs.targets) || '' }}

  sidecars-nightly:
    name: Nightly zebrad sidecars
    permissions:
      contents: read
      id-token: write # sidecar build provenance
      attestations: write # sidecar build provenance
    uses: ./.github/workflows/zebrad-sidecars.yml
    with:
      channel: nightly
      targets: ${{ inputs.targets && format('x86_64-unknown-linux-gnu,{0}', inputs.targets) || '' }}

  docs-inputs:
    name: Resolve the stable documentation pin
    needs: sidecars
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      commit: ${{ steps.resolve.outputs.commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: needs.sidecars.outputs.zebrad_ref != ''
        with:
          github-token: ${{ github.token }}
          run-id: ${{ github.run_id }}
          name: zebrad-stable-x86_64-unknown-linux-gnu
          path: ${{ runner.temp }}/stable
      - id: resolve
        env:
          ZEBRAD_REF: ${{ needs.sidecars.outputs.zebrad_ref }}
          PINNED_VERSION: ${{ needs.sidecars.outputs.version }}
          PINNED_COMMIT: ${{ needs.sidecars.outputs.commit }}
        run: |
          set -euo pipefail
          die() { echo "::error::$*"; exit 1; }
          # shellcheck disable=SC1091 # pin grammars live in scripts/lib.sh
          . scripts/lib.sh
          if [ -z "${ZEBRAD_REF}" ]; then
            version="${PINNED_VERSION}"
            commit="${PINNED_COMMIT}"
          else
            info="${RUNNER_TEMP}/stable/zebrad-build-info.txt"
            test -s "${info}" || die "the custom stable Linux artifact has no zebrad-build-info.txt"
            reported="$(sed -n 's/^zebrad_version=zebrad //p' "${info}" | head -n 1)"
            version="${reported%%+*}"
            commit="$(sed -n 's/^zebrad_commit=//p' "${info}" | head -n 1)"
          fi
          check_zebrad_version "${version}"
          check_commit "${commit}"
          {
            echo "version=${version}"
            echo "commit=${commit}"
          } >> "${GITHUB_OUTPUT}"

  docs:
    name: Offline Zebra documentation
    needs: [sidecars, sidecars-beta, sidecars-nightly, docs-inputs]
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/zebrad-docs.yml
    with:
      stable_version: ${{ needs.docs-inputs.outputs.version }}
      stable_commit: ${{ needs.docs-inputs.outputs.commit }}
      stable_ref: ${{ needs.sidecars.outputs.zebrad_ref }}
      beta_version: ${{ needs.sidecars-beta.outputs.version }}
      beta_commit: ${{ needs.sidecars-beta.outputs.commit }}
      nightly_version: ${{ needs.sidecars-nightly.outputs.version }}
      nightly_commit: ${{ needs.sidecars-nightly.outputs.commit }}

  # ---------------------------------------------------------------------------
  # Unsigned bundles, five targets.
  # ---------------------------------------------------------------------------
  bundle:
    name: Bundle (${{ matrix.target }})
    needs: [targets, sidecars, sidecars-beta, sidecars-nightly, docs]
    runs-on: ${{ matrix.runner }}
    # Empty for macOS and Windows: the job then runs directly on the runner.
    container: ${{ matrix.container }}
    timeout-minutes: 90
    permissions:
      contents: read
      actions: read # same-run sidecar and docs artifacts
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.targets.outputs.matrix) }}
    defaults:
      run:
        shell: bash
    env:
      TARGET: ${{ matrix.target }}
      STABLE_ZEBRAD_VERSION: ${{ needs.sidecars.outputs.version }}
      STABLE_ZEBRAD_COMMIT: ${{ needs.sidecars.outputs.commit }}
      BETA_ZEBRAD_VERSION: ${{ needs.sidecars-beta.outputs.version }}
      BETA_ZEBRAD_COMMIT: ${{ needs.sidecars-beta.outputs.commit }}
      NIGHTLY_ZEBRAD_VERSION: ${{ needs.sidecars-nightly.outputs.version }}
      NIGHTLY_ZEBRAD_COMMIT: ${{ needs.sidecars-nightly.outputs.commit }}
      # Set only for a custom-ref stable development build.
      ZEBRAD_REF: ${{ needs.sidecars.outputs.zebrad_ref }}
      DEV_ZEBRAD_COMMIT: ${{ needs.sidecars.outputs.zebrad_commit }}
      # linuxdeploy (AppImage) cannot use FUSE inside a container.
      APPIMAGE_EXTRACT_AND_RUN: 1
      EXE_SUFFIX: ${{ matrix.exe_suffix }}
    steps:
      # git must exist before checkout, or checkout falls back to a tarball.
      # The rest of LINUX_PACKAGES comes from setup-tauri, which needs the
      # checkout for .github/tool-versions.env.
      - name: Install git (Linux container)
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get install -y --no-install-recommends git ca-certificates

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-tauri

      # Unprivileged, unsigned job: a cache only speeds it up. release.yml uses
      # no caches.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: bundle-${{ matrix.target }}

      - name: Download the stable zebrad sidecar
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          github-token: ${{ github.token }}
          run-id: ${{ github.run_id }}
          name: zebrad-stable-${{ matrix.target }}
          path: ${{ runner.temp }}/sidecars/stable

      - name: Download the beta zebrad sidecar
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          github-token: ${{ github.token }}
          run-id: ${{ github.run_id }}
          name: zebrad-beta-${{ matrix.target }}
          path: ${{ runner.temp }}/sidecars/beta

      - name: Download the nightly zebrad sidecar
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          github-token: ${{ github.token }}
          run-id: ${{ github.run_id }}
          name: zebrad-nightly-${{ matrix.target }}
          path: ${{ runner.temp }}/sidecars/nightly

      - name: Download the offline Zebra documentation
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          github-token: ${{ github.token }}
          run-id: ${{ github.run_id }}
          name: zebra-docs
          path: src-tauri/resources

      # Artifacts lose the executable bit. Check each binary against its own
      # channel pin. A custom-ref stable build has no expected Cargo version;
      # its resolved commit comes from zebrad-build-info.txt instead.
      - id: sidecars
        name: Install and check all zebrad sidecars
        run: |
          set -euo pipefail
          die() { echo "::error::$*"; exit 1; }
          # shellcheck disable=SC1091 # version checks live in scripts/lib.sh
          . scripts/lib.sh
          runs=true
          for channel in stable beta nightly; do
            suffix=""
            [ "${channel}" = stable ] || suffix="-${channel}"
            prefix="$(tr '[:lower:]' '[:upper:]' <<< "${channel}")"
            version_var="${prefix}_ZEBRAD_VERSION"
            commit_var="${prefix}_ZEBRAD_COMMIT"
            expected_version="${!version_var}"
            expected_commit="${!commit_var}"
            custom=false
            if [ "${channel}" = stable ] && [ -n "${ZEBRAD_REF}" ]; then
              custom=true
              expected_commit="${DEV_ZEBRAD_COMMIT}"
            fi
            artifact="${RUNNER_TEMP}/sidecars/${channel}/zeal-zebrad${suffix}-${TARGET}${EXE_SUFFIX}"
            sidecar="src-tauri/binaries/zeal-zebrad${suffix}-${TARGET}${EXE_SUFFIX}"
            info="${RUNNER_TEMP}/sidecars/${channel}/zebrad-build-info.txt"
            mkdir -p "$(dirname "${sidecar}")"
            cp "${artifact}" "${sidecar}"
            chmod +x "${sidecar}"
            if [ "${custom}" = true ] || [ "${channel}" = nightly ]; then
              test -s "${info}" || die "the zebrad-${channel}-${TARGET} artifact has no zebrad-build-info.txt"
            fi
            if [ -f "${info}" ]; then
              cat "${info}"
              grep -qx "zebrad_commit=${expected_commit}" "${info}" \
                || die "${channel} zebrad-build-info.txt is not for Zebra commit ${expected_commit}"
            fi
            if [ "${custom}" = false ]; then
              check_reported_version "${sidecar}" "${expected_version}"
              "${sidecar}" --version | head -n 1
              continue
            fi

            version_file="${RUNNER_TEMP}/zebrad-version-${channel}.txt"
            if "${sidecar}" --version > "${version_file}" 2>&1; then
              cat "${version_file}"
              grep -q '^zebrad ' "${version_file}" \
                || die "the custom stable sidecar does not report 'zebrad <version>'"
            elif [ "${RUNNER_OS}" = Linux ]; then
              cat "${version_file}"
              echo "::warning::the custom stable zebrad does not run in this ubuntu:22.04 container (probably a newer glibc); the Linux install smoke tests are skipped"
              runs=false
            else
              cat "${version_file}"
              die "the custom stable zebrad does not run"
            fi
          done
          echo "runs=${runs}" >> "${GITHUB_OUTPUT}"
          if [ -n "${ZEBRAD_REF}" ]; then
            info="${RUNNER_TEMP}/sidecars/stable/zebrad-build-info.txt"
            version_string="$(sed -n 's/^zebrad_version=//p' "${info}")"
            echo "short=${DEV_ZEBRAD_COMMIT:0:7}" >> "${GITHUB_OUTPUT}"
            echo "::warning title=Development build::stable zebrad from ${ZEBRAD_REF} @ ${DEV_ZEBRAD_COMMIT} (${version_string}); beta and nightly remain pinned; unsigned and unverified, never release it"
            {
              echo "## DEV BUILD (${TARGET}): unsigned and unverified"
              echo
              echo "| | |"
              echo "| --- | --- |"
              echo "| stable zebrad ref | \`${ZEBRAD_REF}\` |"
              echo "| stable Zebra commit | [\`${DEV_ZEBRAD_COMMIT}\`](https://github.com/ZcashFoundation/zebra/commit/${DEV_ZEBRAD_COMMIT}) |"
              echo "| stable zebrad --version | \`${version_string}\` |"
              echo "| beta zebrad | \`${BETA_ZEBRAD_VERSION}\` at \`${BETA_ZEBRAD_COMMIT}\` |"
              echo "| nightly zebrad | \`${NIGHTLY_ZEBRAD_VERSION}\` at \`${NIGHTLY_ZEBRAD_COMMIT}\` |"
              echo
              echo "> [!WARNING]"
              echo "> Stable was built from a Zebra git ref, not from a verified Zebra release, and nothing in this build is signed. Beta and nightly remain pinned. Use this build for testing only; never release or distribute it."
            } >> "${GITHUB_STEP_SUMMARY}"
          fi

      # Unsigned: no updater artifacts (they would need TAURI_SIGNING_PRIVATE_KEY),
      # and an ad-hoc signature on macOS so the app opens via "Open Anyway".
      - name: Write the unsigned bundle config
        run: |
          set -euo pipefail
          if [ "${RUNNER_OS}" = macOS ]; then
            echo '{"bundle":{"createUpdaterArtifacts":false,"macOS":{"signingIdentity":"-"}}}'
          else
            echo '{"bundle":{"createUpdaterArtifacts":false}}'
          fi > "${RUNNER_TEMP}/tauri.unsigned.json"
          cat "${RUNNER_TEMP}/tauri.unsigned.json"

      - name: Check Cargo.lock is up to date
        run: cargo fetch --locked

      # The updater key must be absent, not empty: tauri-cli treats an empty
      # TAURI_SIGNING_PRIVATE_KEY as a key.
      - name: Build bundles
        run: |
          set -euo pipefail
          unset TAURI_SIGNING_PRIVATE_KEY TAURI_SIGNING_PRIVATE_KEY_PASSWORD
          cargo tauri build --target "${TARGET}" --ci \
            --config "${RUNNER_TEMP}/tauri.unsigned.json"

      - name: Check the offline documentation resources
        run: |
          set -euo pipefail
          for channel in stable beta nightly; do
            for page in book/index.html config.html changes.html; do
              resource="src-tauri/resources/zebra-docs/${channel}/${page}"
              test -s "${resource}" || { echo "::error::missing offline documentation ${resource}"; exit 1; }
            done
          done

      # Only a custom-ref stable sidecar is exempt: beta and pinned nightly are
      # release-channel binaries and must meet the same floor as the launcher.
      - name: Check the glibc floor
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          binaries=("target/${TARGET}/release/${APP_BIN}")
          for channel in stable beta nightly; do
            suffix=""
            [ "${channel}" = stable ] || suffix="-${channel}"
            if [ "${channel}" = stable ] && [ -n "${ZEBRAD_REF}" ]; then
              echo "Not checked: the custom-ref stable zebrad sidecar"
            else
              binaries+=("src-tauri/binaries/zeal-zebrad${suffix}-${TARGET}")
            fi
          done
          scripts/check-glibc.sh --floor "${GLIBC_FLOOR}" "${binaries[@]}"

      - name: Collect bundles
        run: |
          set -euo pipefail
          args=(--target "${TARGET}" --out dist)
          [ -z "${ZEBRAD_REF}" ] || args+=(--raw)
          scripts/collect-bundles.sh "${args[@]}"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: needs.sidecars.outputs.zebrad_ref == ''
        with:
          name: bundle-${{ matrix.target }}
          path: dist/
          if-no-files-found: error

      # collect-bundles.sh --raw has already placed the launcher and all three
      # runtime-named sidecars in dist/raw. Preserve each channel's build info.
      - name: Add the build info (development build)
        if: needs.sidecars.outputs.zebrad_ref != ''
        run: |
          set -euo pipefail
          for channel in stable beta nightly; do
            suffix=""
            [ "${channel}" = stable ] || suffix="-${channel}"
            info="${RUNNER_TEMP}/sidecars/${channel}/zebrad-build-info.txt"
            [ ! -f "${info}" ] || cp "${info}" "dist/zebrad-build-info${suffix}.txt"
          done
          ls -lR dist

      - name: Upload bundles (development build)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: needs.sidecars.outputs.zebrad_ref != ''
        with:
          name: bundles-${{ matrix.target }}-dev-${{ steps.sidecars.outputs.short }}
          path: dist/
          if-no-files-found: error

      # -----------------------------------------------------------------------
      # Linux x86_64 install smoke tests. A custom-ref stable build runs them
      # only when that sidecar runs in this container; pinned beta and nightly
      # were already required to run during installation.
      # -----------------------------------------------------------------------
      - id: smoke
        name: Decide whether the Linux install smoke tests run
        env:
          SIDECARS_RUN: ${{ steps.sidecars.outputs.runs }}
        run: |
          set -euo pipefail
          if [ "${TARGET}" = x86_64-unknown-linux-gnu ] && [ "${SIDECARS_RUN}" = true ]; then
            run=true
          else
            run=false
          fi
          echo "Linux install smoke tests: ${run}"
          echo "run=${run}" >> "${GITHUB_OUTPUT}"

      - name: "Smoke: install smoke-test packages"
        if: steps.smoke.outputs.run == 'true'
        run: |
          set -euo pipefail
          export DEBIAN_FRONTEND=noninteractive
          apt-get install -y --no-install-recommends xvfb xauth dbus dbus-x11 procps

      - name: "Smoke: install the .deb and check all sidecars"
        if: steps.smoke.outputs.run == 'true'
        run: |
          set -euo pipefail
          export DEBIAN_FRONTEND=noninteractive
          apt-get install -y ./dist/zeal_*_amd64.deb
          dpkg -L zeal-app | grep -E '/usr/bin/'
          for channel in stable beta nightly; do
            suffix=""
            [ "${channel}" = stable ] || suffix="-${channel}"
            sidecar="/usr/bin/zeal-zebrad${suffix}"
            reported="$("${sidecar}" --version | head -n 1)"
            echo "${sidecar}: ${reported}"
            if [ "${channel}" = stable ] && [ -n "${ZEBRAD_REF}" ]; then
              case "${reported}" in
                "zebrad "?*) ;;
                *) echo "::error::${sidecar} does not report 'zebrad <version>'"; exit 1 ;;
              esac
            else
              prefix="$(tr '[:lower:]' '[:upper:]' <<< "${channel}")"
              version_var="${prefix}_ZEBRAD_VERSION"
              expected_version="${!version_var}"
              case "${reported}" in
                "zebrad ${expected_version}" | "zebrad ${expected_version} "* | "zebrad ${expected_version}+"*) ;;
                *) echo "::error::${sidecar} is not zebrad ${expected_version}"; exit 1 ;;
              esac
            fi
          done

      - name: "Smoke: run the .deb install"
        if: steps.smoke.outputs.run == 'true'
        run: scripts/smoke-linux.sh --deb

      - name: "Smoke: run the AppImage"
        if: steps.smoke.outputs.run == 'true'
        run: scripts/smoke-linux.sh --appimage dist/zeal_*_x86_64.AppImage
