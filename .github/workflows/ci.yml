name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  lint-test:
    name: Lint and test (Linux)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Validate every channel pin before compiling fake-zebrad and the app.
      - run: scripts/check-versions.sh
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          # The toolchain comes from rust-toolchain.toml.
          cache: false
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # The one Linux package list, shared with the bundle jobs and DEVELOPMENT.md.
      - name: Install the Linux packages Tauri builds against (LINUX_PACKAGES)
        run: |
          set -euo pipefail
          packages="$(sed -n 's/^LINUX_PACKAGES=//p' .github/tool-versions.env)"
          [ -n "${packages}" ] || { echo "::error::no LINUX_PACKAGES in .github/tool-versions.env"; exit 1; }
          sudo apt-get update
          # shellcheck disable=SC2086 # LINUX_PACKAGES is a word list
          sudo apt-get install -y --no-install-recommends ${packages}
      - run: cargo fmt --all --check
      # tauri-build requires every sidecar named in bundle.externalBin: on
      # Linux zeal-zingod too, which the script installs as fake-zingod.
      - name: Install fake-zebrad as all channel sidecars, and fake-zingod
        run: scripts/dev-sidecar.sh
      - run: cargo clippy --workspace --all-targets --locked
      - run: cargo test --workspace --locked
      # The UI as it ships: compiled for wasm32 (rust-toolchain.toml installs the
      # target), then built by trunk with the pinned wasm-bindgen and wasm-opt.
      # setup-tauri without its bundler half: no tauri-cli, no second toolchain.
      - run: cargo clippy -p ui --target wasm32-unknown-unknown --locked
      - uses: ./.github/actions/setup-tauri
        with:
          bundler: "false"
      - run: trunk build --release
        working-directory: ui

  deny:
    name: cargo deny
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check

  # The bash in scripts/ and docs/observability/, and the workflows (actionlint
  # also hands every `run:` block to shellcheck). actionlint does not read
  # composite actions, so the small steps of .github/actions/setup-tauri/action.yml
  # are not covered; its tool install is scripts/install-pinned-tools.sh, which is.
  lint-scripts:
    name: shellcheck and actionlint
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Release binaries at the versions pinned in .github/tool-versions.env,
      # each checked against its sha256 pin before it runs, as
      # scripts/install-pinned-tools.sh does for the build tools.
      # scripts/refresh-tool-pins.sh refreshes the pins.
      - name: Install shellcheck and actionlint (pinned)
        run: |
          set -euo pipefail
          pin() { sed -n "s/^$1=//p" .github/tool-versions.env | tr -d '\r'; }
          bin="${RUNNER_TEMP}/lint-tools"
          mkdir -p "${bin}"
          fetch() { # fetch URL SHA256 ARCHIVE
            curl --proto '=https' --tlsv1.2 -sSfL --retry 3 -o "$3" "$1"
            echo "$2  $3" | sha256sum -c -
          }
          version="$(pin SHELLCHECK_VERSION)"
          fetch "https://github.com/koalaman/shellcheck/releases/download/v${version}/shellcheck-v${version}.linux.x86_64.tar.xz" \
            "$(pin SHELLCHECK_SHA256_X86_64_LINUX)" "${RUNNER_TEMP}/shellcheck.tar.xz"
          tar -xJf "${RUNNER_TEMP}/shellcheck.tar.xz" -C "${bin}" --strip-components=1 "shellcheck-v${version}/shellcheck"
          version="$(pin ACTIONLINT_VERSION)"
          fetch "https://github.com/rhysd/actionlint/releases/download/v${version}/actionlint_${version}_linux_amd64.tar.gz" \
            "$(pin ACTIONLINT_SHA256_X86_64_LINUX)" "${RUNNER_TEMP}/actionlint.tar.gz"
          tar -xzf "${RUNNER_TEMP}/actionlint.tar.gz" -C "${bin}" actionlint
          echo "${bin}" >> "${GITHUB_PATH}"
          "${bin}/shellcheck" --version
          "${bin}/actionlint" -version
      - run: shellcheck scripts/*.sh docs/observability/*.sh
      - run: actionlint

  # The contract tests against the real, pinned zebrad
  # (crates/launcher-core/tests/real_zebrad.rs), which pass silently without
  # ZEBRAD_BIN. They run on pushes to main and on pull requests that change
  # ZEBRAD_VERSION or ZEBRAD_COMMIT (every zebrad-watch bump), so pull-request
  # CI stays fast and a bump cannot break stop detection or exit
  # classification with every job green. Linux only: that is where a verified
  # release binary exists (scripts/fetch-zebrad-linux.sh).
  real-zebrad:
    name: Real-zebrad contract tests (Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The gate step diffs a pull request against its base.
          fetch-depth: 0
      - id: gate
        name: Decide whether the tests run
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          run=false
          if [ "${EVENT}" = push ]; then
            run=true
          else
            changed="$(git diff --name-only "${BASE_SHA}...HEAD")"
            if grep -qxE 'ZEBRAD_VERSION|ZEBRAD_COMMIT' <<< "${changed}"; then
              run=true
            fi
          fi
          echo "run the real-zebrad contract tests: ${run}"
          echo "run=${run}" >> "${GITHUB_OUTPUT}"
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        if: steps.gate.outputs.run == 'true'
      # cosign, sha256 and the GitHub attestation, as zebrad-sidecars.yml checks.
      - name: Fetch and verify the pinned zebrad
        if: steps.gate.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REQUIRE_ATTESTATION: "1"
        run: scripts/fetch-zebrad-linux.sh --out "${RUNNER_TEMP}/zebrad/zebrad"
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        if: steps.gate.outputs.run == 'true'
        with:
          cache: false
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        if: steps.gate.outputs.run == 'true'
      # The contract tests are `#[ignore]` so plain `cargo test` stays hermetic;
      # --include-ignored runs them here, and they fail loudly without ZEBRAD_BIN.
      - name: Run the contract tests
        if: steps.gate.outputs.run == 'true'
        env:
          ZEBRAD_BIN: ${{ runner.temp }}/zebrad/zebrad
        run: cargo test -p launcher-core --test real_zebrad --locked -- --include-ignored --nocapture
      # zebrad's light wallet endpoint, straight and through the front door
      # (crates/launcher-public/tests/real_light_server.rs).
      - name: Run the light wallet endpoint's contract test
        if: steps.gate.outputs.run == 'true'
        env:
          ZEBRAD_BIN: ${{ runner.temp }}/zebrad/zebrad
        run: cargo test -p launcher-public --test real_light_server --locked -- --include-ignored --nocapture
  # zeal-zingod, built and checked as the bundles get it, on pull requests that
  # change what it is built from: the ZINGOD_* pins; build-zingod.sh, the
  # lib.sh it sources and the check-glibc.sh it runs; zingod-licenses.sh, the
  # cargo-lock-version.sh it runs and the licence folder it checks;
  # zingod-sidecars.yml with the select-targets.sh and targets.json that pick
  # its matrix; or the GLIBC_FLOOR and CARGO_DENY_* lines of tool-versions.env.
  # It also runs whenever the zingod contract test does (real-zingod below),
  # which takes its zingod from this build: on every push to main, and on pull
  # requests that change ZEBRAD_VERSION or ZEBRAD_COMMIT, zingod's adapter in
  # launcher-core, its runner and contract test in launcher-public, or the
  # front door (launcher-gateway). A job that calls a reusable workflow can't
  # have steps, so this one decides.
  zingod-gate:
    name: Decide whether zingod is built
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      run: ${{ steps.gate.outputs.run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The gate diffs a pull request against its base.
          fetch-depth: 0
          persist-credentials: false
      - id: gate
        name: Decide whether zingod is built
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          run=false
          if [ "${EVENT}" = push ]; then
            run=true
          elif [ "${EVENT}" = pull_request ]; then
            changed="$(git diff --name-only "${BASE_SHA}...HEAD")"
            if grep -qxE 'ZINGOD_(VERSION|COMMIT|DATE)|scripts/(build-zingod|zingod-licenses|lib|check-glibc|cargo-lock-version|select-targets)\.sh|\.github/targets\.json|src-tauri/resources/licenses/zingod/.+|\.github/workflows/zingod-sidecars\.yml' <<< "${changed}"; then
              run=true
            fi
            # The contract test's inputs (real-zingod).
            if grep -qxE 'ZEBRAD_(VERSION|COMMIT)|crates/launcher-core/src/zingod/.+|crates/launcher-core/src/bin/fake-zingod\.rs|crates/launcher-public/src/zingod\.rs|crates/launcher-public/tests/real_zingod\.rs|crates/launcher-gateway/.+' <<< "${changed}"; then
              run=true
            fi
            # Of tool-versions.env, only the lines the build reads.
            pins="$(git diff "${BASE_SHA}...HEAD" -- .github/tool-versions.env)"
            if grep -qE '^[+-](GLIBC_FLOOR|CARGO_DENY_)' <<< "${pins}"; then
              run=true
            fi
          fi
          echo "build zingod: ${run}"
          echo "run=${run}" >> "${GITHUB_OUTPUT}"

  # Without attestation: a fork's pull request gets no OIDC token, and a binary
  # built from an unmerged branch never carries one. The called jobs declare
  # id-token and attestations, so this job grants them, beside ci.yml's
  # contents: read.
  zingod-sidecars:
    name: zingod sidecars
    needs: zingod-gate
    if: needs.zingod-gate.outputs.run == 'true'
    permissions:
      contents: read
      id-token: write # declared by the called build jobs; unused with attest false
      attestations: write # declared by the called build jobs; unused with attest false
    uses: ./.github/workflows/zingod-sidecars.yml
    with:
      attest: false

  # The contract test against the real zingod and zebrad
  # (crates/launcher-public/tests/real_zingod.rs), on both Linux targets: the
  # aarch64 leg is what the Mainnet gate's first item needs. zingod comes from
  # the zingod-sidecars build above, made in ubuntu:22.04, since a build on the
  # 24.04 runner itself needs GLIBC_2.39 and the runner has no protoc; a
  # binary built there runs on the 24.04 host. zebrad is the pinned release,
  # fetched and verified on the host as real-zebrad does.
  real-zingod:
    name: Real-zingod contract test (${{ matrix.target }})
    needs: [zingod-gate, zingod-sidecars]
    if: needs.zingod-gate.outputs.run == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read # same-run zingod artifact
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download this run's zingod
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          github-token: ${{ github.token }}
          run-id: ${{ github.run_id }}
          name: zingod-${{ matrix.target }}
          path: ${{ runner.temp }}/zingod
      # The binary checked against the pins and the sha256 its build recorded.
      - name: Install and check zingod
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          die() { echo "::error::$*"; exit 1; }
          # shellcheck disable=SC1091 # install_zingod lives in scripts/lib.sh
          . scripts/lib.sh
          install_zingod "${RUNNER_TEMP}/zingod" "${TARGET}" .
          echo "ZINGOD_BIN=${GITHUB_WORKSPACE}/src-tauri/binaries/zeal-zingod-${TARGET}" >> "${GITHUB_ENV}"
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      # cosign, sha256 and the GitHub attestation, as zebrad-sidecars.yml checks.
      - name: Fetch and verify the pinned zebrad
        env:
          GH_TOKEN: ${{ github.token }}
          REQUIRE_ATTESTATION: "1"
          TARGET: ${{ matrix.target }}
        run: scripts/fetch-zebrad-linux.sh --target "${TARGET}" --out "${RUNNER_TEMP}/zebrad/zebrad"
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          cache: false
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # `#[ignore]` so plain `cargo test` stays hermetic; --include-ignored runs
      # it here, and it fails loudly without ZEBRAD_BIN or ZINGOD_BIN.
      - name: Run the zingod contract test
        env:
          ZEBRAD_BIN: ${{ runner.temp }}/zebrad/zebrad
        run: cargo test -p launcher-public --test real_zingod --locked -- --include-ignored --nocapture

  # Certificates against Pebble, Let's Encrypt's test ACME server, through the
  # real front door (crates/launcher-public/tests/pebble.rs). The test passes
  # with a note without the binaries; PEBBLE_REQUIRED makes it fail instead, so
  # this job cannot pass without running it.
  pebble:
    name: ACME against Pebble (Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Pebble and pebble-challtestsrv (pinned)
        run: |
          set -euo pipefail
          pin() { sed -n "s/^$1=//p" .github/tool-versions.env | tr -d '\r'; }
          version="$(pin PEBBLE_VERSION)"
          dir="${RUNNER_TEMP}/pebble"
          mkdir -p "${dir}"
          fetch() { # fetch NAME SHA256
            curl --proto '=https' --tlsv1.2 -sSfL --retry 3 -o "${dir}/$1.tar.gz" \
              "https://github.com/letsencrypt/pebble/releases/download/v${version}/$1-linux-amd64.tar.gz"
            echo "$2  ${dir}/$1.tar.gz" | sha256sum -c -
            tar -xzf "${dir}/$1.tar.gz" -C "${dir}" --strip-components=3 "$1-linux-amd64/linux/amd64/$1"
            chmod +x "${dir}/$1"
          }
          fetch pebble "$(pin PEBBLE_SHA256_X86_64_LINUX)"
          fetch pebble-challtestsrv "$(pin PEBBLE_CHALLTESTSRV_SHA256_X86_64_LINUX)"
          {
            echo "PEBBLE=${dir}/pebble"
            echo "PEBBLE_CHALLTESTSRV=${dir}/pebble-challtestsrv"
          } >> "${GITHUB_ENV}"
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          cache: false
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Run the ACME test
        env:
          PEBBLE_REQUIRED: "1"
        run: cargo test -p launcher-public --test pebble --locked -- --nocapture

  test-os:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, macos-15]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          cache: false
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # tauri-build requires every sidecar named in bundle.externalBin.
      - name: Install fake-zebrad as all channel sidecars (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: scripts/dev-sidecar.ps1
      - name: Install fake-zebrad as all channel sidecars (macOS)
        if: runner.os == 'macOS'
        run: scripts/dev-sidecar.sh
      - run: cargo clippy --workspace --all-targets --locked
      - run: cargo test --workspace --locked
