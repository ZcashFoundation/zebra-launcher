# Installs what `cargo tauri build` / `cargo tauri bundle` need: the tool pins
# from .github/tool-versions.env (loaded into $GITHUB_ENV for the rest of the
# job), the Linux packages (LINUX_PACKAGES, in the ubuntu:22.04 container, as
# root), the Rust toolchain from rust-toolchain.toml, and tauri-cli and trunk
# at the pinned versions. Used by bundle.yml and
# release.yml; runs after actions/checkout, from the repository root.
#
# Rust toolchain: the macOS and Windows runner images ship rustup, so only the
# toolchain is installed. In the ubuntu:22.04 container there is no rustup; it
# is installed from the official rustup-init binary at a pinned version,
# checked against a sha256 recorded here. (actions-rust-lang/setup-rust-toolchain
# would instead pipe the unpinned sh.rustup.rs script into sh when rustup is
# missing, so the container path would depend on whatever that script is on the
# day.) Update RUSTUP_VERSION and both hashes together, from
# https://static.rust-lang.org/rustup/archive/<version>/<triple>/rustup-init.sha256.
#
# tauri-cli and trunk are their GitHub release binaries for the exact pinned
# versions, checked against the per-platform sha256 pins in
# .github/tool-versions.env. Nothing is compiled from crates.io, and nothing
# is installed without a recorded hash.
name: Set up the Tauri toolchain
description: Tool pins from .github/tool-versions.env, Linux packages, Rust toolchain, tauri-cli and (to compile) trunk.

inputs:
  compile:
    description: '"true" when the job compiles the app (installs trunk); "false" when it only bundles'
    required: false
    default: "true"

runs:
  using: composite
  steps:
    # KEY=value lines only (no `KEY<<DELIM` multi-line values), with CRs
    # dropped in case a Windows checkout converted line endings.
    - name: Load the tool pins
      shell: bash
      run: |
        set -euo pipefail
        pins="${GITHUB_WORKSPACE}/.github/tool-versions.env"
        while IFS= read -r line || [ -n "${line}" ]; do
          line="${line%$'\r'}"
          case "${line}" in
            '' | '#'*) continue ;;
          esac
          if ! [[ "${line}" =~ ^[A-Z][A-Z0-9_]*= ]]; then
            echo "::error file=.github/tool-versions.env::malformed line: ${line}"
            exit 1
          fi
          printf '%s\n' "${line}" >> "${GITHUB_ENV}"
        done < "${pins}"

    - name: Install Linux packages
      if: runner.os == 'Linux'
      shell: bash
      run: |
        set -euo pipefail
        export DEBIAN_FRONTEND=noninteractive
        apt-get update
        # shellcheck disable=SC2086 # LINUX_PACKAGES is a word list
        apt-get install -y --no-install-recommends ${LINUX_PACKAGES}

    - name: Install rustup (container)
      if: runner.os == 'Linux'
      shell: bash
      env:
        RUSTUP_VERSION: 1.29.2
        RUSTUP_INIT_SHA256_X86_64: 5be191e8c70a5007074254cb74d78dbfdd25cd5a61c27de7b8e5410122ec24f4
        RUSTUP_INIT_SHA256_AARCH64: a9c168dbea81a84671c6b7a5c1795cb0eb699020110d107ddfca427bd797e697
      run: |
        set -euo pipefail
        if command -v rustup > /dev/null 2>&1; then
          echo "rustup is already installed: $(rustup --version 2> /dev/null)"
          exit 0
        fi
        case "$(uname -m)" in
          x86_64) triple=x86_64-unknown-linux-gnu; sha256="${RUSTUP_INIT_SHA256_X86_64}" ;;
          aarch64) triple=aarch64-unknown-linux-gnu; sha256="${RUSTUP_INIT_SHA256_AARCH64}" ;;
          *) echo "::error::no pinned rustup-init for $(uname -m)"; exit 1 ;;
        esac
        init="${RUNNER_TEMP}/rustup-init"
        curl --proto '=https' --tlsv1.2 -sSf -o "${init}" \
          "https://static.rust-lang.org/rustup/archive/${RUSTUP_VERSION}/${triple}/rustup-init"
        echo "${sha256}  ${init}" | sha256sum -c -
        chmod +x "${init}"
        "${init}" -y --no-modify-path --profile minimal --default-toolchain none
        rm -f "${init}"
        echo "${CARGO_HOME:-${HOME}/.cargo}/bin" >> "${GITHUB_PATH}"

    # Without arguments, `rustup toolchain install` installs the toolchain,
    # components and targets named in rust-toolchain.toml (rustup >= 1.28).
    - name: Install the Rust toolchain from rust-toolchain.toml
      shell: bash
      run: |
        set -euo pipefail
        rustup toolchain install --profile minimal
        rustc --version
        cargo --version

    # Release binaries for the exact pinned versions, each checked against the
    # sha256 in .github/tool-versions.env before it is unpacked; a missing or
    # wrong hash fails the job. Installed into $CARGO_HOME/bin, which is on
    # PATH, so `cargo tauri` finds cargo-tauri.
    - name: Install tauri-cli and trunk
      shell: bash
      env:
        COMPILE: ${{ inputs.compile }}
      run: |
        set -euo pipefail
        host="$(rustc -vV | sed -n 's/^host: //p')"
        bin="${CARGO_HOME:-${HOME}/.cargo}/bin"
        work="${RUNNER_TEMP}/tauri-tools"
        rm -rf "${work}"
        mkdir -p "${work}" "${bin}"
        case "${host}" in
          *-windows-*) exe=.exe ;;
          *) exe="" ;;
        esac

        sha256_of() {
          if command -v sha256sum > /dev/null 2>&1; then
            sha256sum "$1" | cut -d' ' -f1
          else
            shasum -a 256 "$1" | cut -d' ' -f1
          fi
        }

        # fetch NAME URL TRIPLE BINARY: downloads URL, checks it against
        # <NAME>_SHA256_<TRIPLE> and installs BINARY from it into ${bin}.
        fetch() {
          local name="$1" url="$2" triple="$3" binary="$4"
          local var want got archive dir
          var="${name}_SHA256_$(printf '%s' "${triple}" | tr 'a-z-' 'A-Z_')"
          want="${!var:-}"
          if [ -z "${want}" ]; then
            echo "::error::${var} is not in .github/tool-versions.env"
            exit 1
          fi
          archive="${work}/${url##*/}"
          curl --proto '=https' --tlsv1.2 -sSfL --retry 3 -o "${archive}" "${url}"
          got="$(sha256_of "${archive}")"
          if [ "${got}" != "${want}" ]; then
            echo "::error::${url##*/} has sha256 ${got}, expected ${want} (${var})"
            exit 1
          fi
          echo "${url##*/}: sha256 ${got} OK"
          dir="${work}/${name}"
          mkdir -p "${dir}"
          case "${archive}" in
            *.zip)
              if command -v 7z > /dev/null 2>&1; then
                7z x -y -o"${dir}" "${archive}" > /dev/null
              else
                unzip -q -o "${archive}" -d "${dir}"
              fi
              ;;
            *) tar -xzf "${archive}" -C "${dir}" ;;
          esac
          cp "${dir}/${binary}" "${bin}/${binary}"
          chmod +x "${bin}/${binary}"
        }

        case "${host}" in
          *-linux-*) cli_ext=tgz ;;
          *) cli_ext=zip ;;
        esac
        fetch TAURI_CLI \
          "https://github.com/tauri-apps/tauri/releases/download/tauri-cli-v${TAURI_CLI_VERSION}/cargo-tauri-${host}.${cli_ext}" \
          "${host}" "cargo-tauri${exe}"
        [ "$(cargo tauri --version)" = "tauri-cli ${TAURI_CLI_VERSION}" ] \
          || { echo "::error::cargo tauri --version is '$(cargo tauri --version)', expected tauri-cli ${TAURI_CLI_VERSION}"; exit 1; }
        cargo tauri --version

        if [ "${COMPILE}" = true ]; then
          case "${host}" in
            *-windows-*) trunk_triple="${host}"; trunk_ext=zip ;;
            *-linux-gnu) trunk_triple="${host%-gnu}-musl"; trunk_ext=tar.gz ;;
            *) trunk_triple="${host}"; trunk_ext=tar.gz ;;
          esac
          fetch TRUNK \
            "https://github.com/trunk-rs/trunk/releases/download/v${TRUNK_VERSION}/trunk-${trunk_triple}.${trunk_ext}" \
            "${trunk_triple}" "trunk${exe}"
          [ "$(trunk --version)" = "trunk ${TRUNK_VERSION}" ] \
            || { echo "::error::trunk --version is '$(trunk --version)', expected trunk ${TRUNK_VERSION}"; exit 1; }
          trunk --version
        fi
        rm -rf "${work}"
