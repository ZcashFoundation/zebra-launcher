# Installs what `cargo tauri build` / `cargo tauri bundle` need: the tool pins
# from .github/tool-versions.env (loaded into $GITHUB_ENV for the rest of the
# job), the Linux packages (LINUX_PACKAGES, in the ubuntu:22.04 container, as
# root), the Rust toolchain from rust-toolchain.toml, and tauri-cli, plus
# trunk, wasm-bindgen and wasm-opt to compile, at the pinned versions. Used by
# bundle.yml and release.yml; runs after actions/checkout, from the repository
# root.
#
# Rust toolchain: the macOS and Windows runner images ship rustup, so only the
# toolchain is installed. In the ubuntu:22.04 container there is no rustup; it
# is installed from the official rustup-init binary at a pinned version,
# checked against a sha256 recorded here. (actions-rust-lang/setup-rust-toolchain
# would instead pipe the unpinned sh.rustup.rs script into sh when rustup is
# missing, so the container path would depend on whatever that script is on the
# day.) Update RUSTUP_VERSION and both hashes together, from
# https://static.rust-lang.org/rustup/archive/<version>/<triple>/rustup-init.sha256.
#
# tauri-cli, trunk, wasm-bindgen and wasm-opt (binaryen) are their GitHub
# release binaries for the exact pinned versions, checked against the
# per-platform sha256 pins in .github/tool-versions.env by
# scripts/install-pinned-tools.sh, which shellcheck covers and which can be
# dry-run locally. Nothing is compiled from crates.io, and nothing is installed
# without a recorded hash. To compile, trunk then runs offline
# (TRUNK_OFFLINE=true in $GITHUB_ENV), so it cannot download its own
# wasm-bindgen or wasm-opt: it uses the pinned ones on PATH, at exactly the
# versions it requires, or fails.
#
# With `bundler: "false"` only the pins and the frontend tools are installed:
# for a job on a plain runner that already has the toolchain and only needs
# `trunk build` (the lint job of ci.yml).
name: Set up the Tauri toolchain
description: Tool pins from .github/tool-versions.env, Linux packages, Rust toolchain, tauri-cli and (to compile) trunk, wasm-bindgen and wasm-opt.

inputs:
  compile:
    description: '"true" when the job compiles the app (installs trunk, wasm-bindgen and wasm-opt); "false" when it only bundles'
    required: false
    default: "true"
  bundler:
    description: '"true" when the job runs cargo tauri build or bundle (installs the Linux packages, rustup, the Rust toolchain and tauri-cli); "false" for a job that already has a toolchain and only needs trunk, wasm-bindgen and wasm-opt'
    required: false
    default: "true"

runs:
  using: composite
  steps:
    # KEY=value lines only (no `KEY<<DELIM` multi-line values), with CRs
    # dropped in case a Windows checkout converted line endings.
    - name: Load the tool pins
      shell: bash
      run: |
        set -euo pipefail
        pins="${GITHUB_WORKSPACE}/.github/tool-versions.env"
        while IFS= read -r line || [ -n "${line}" ]; do
          line="${line%$'\r'}"
          case "${line}" in
            '' | '#'*) continue ;;
          esac
          if ! [[ "${line}" =~ ^[A-Z][A-Z0-9_]*= ]]; then
            echo "::error file=.github/tool-versions.env::malformed line: ${line}"
            exit 1
          fi
          printf '%s\n' "${line}" >> "${GITHUB_ENV}"
        done < "${pins}"

    - name: Install Linux packages
      if: runner.os == 'Linux' && inputs.bundler == 'true'
      shell: bash
      run: |
        set -euo pipefail
        export DEBIAN_FRONTEND=noninteractive
        apt-get update
        # shellcheck disable=SC2086 # LINUX_PACKAGES is a word list
        apt-get install -y --no-install-recommends ${LINUX_PACKAGES}

    - name: Install rustup (container)
      if: runner.os == 'Linux' && inputs.bundler == 'true'
      shell: bash
      env:
        RUSTUP_VERSION: 1.29.2
        RUSTUP_INIT_SHA256_X86_64: 5be191e8c70a5007074254cb74d78dbfdd25cd5a61c27de7b8e5410122ec24f4
        RUSTUP_INIT_SHA256_AARCH64: a9c168dbea81a84671c6b7a5c1795cb0eb699020110d107ddfca427bd797e697
      run: |
        set -euo pipefail
        if command -v rustup > /dev/null 2>&1; then
          echo "rustup is already installed: $(rustup --version 2> /dev/null)"
          exit 0
        fi
        case "$(uname -m)" in
          x86_64) triple=x86_64-unknown-linux-gnu; sha256="${RUSTUP_INIT_SHA256_X86_64}" ;;
          aarch64) triple=aarch64-unknown-linux-gnu; sha256="${RUSTUP_INIT_SHA256_AARCH64}" ;;
          *) echo "::error::no pinned rustup-init for $(uname -m)"; exit 1 ;;
        esac
        init="${RUNNER_TEMP}/rustup-init"
        curl --proto '=https' --tlsv1.2 -sSf -o "${init}" \
          "https://static.rust-lang.org/rustup/archive/${RUSTUP_VERSION}/${triple}/rustup-init"
        echo "${sha256}  ${init}" | sha256sum -c -
        chmod +x "${init}"
        "${init}" -y --no-modify-path --profile minimal --default-toolchain none
        rm -f "${init}"
        echo "${CARGO_HOME:-${HOME}/.cargo}/bin" >> "${GITHUB_PATH}"

    # Only what this job needs: rust-toolchain.toml's channel with the minimal
    # profile, plus the wasm32 target when it compiles the frontend. The
    # file's clippy and rustfmt are for development and the lint jobs, not
    # for building or bundling. RUSTUP_TOOLCHAIN then selects that toolchain
    # for the rest of the job, so rustup does not go back to the toolchain
    # file and install its components after all.
    - name: Install the Rust toolchain
      if: inputs.bundler == 'true'
      shell: bash
      env:
        COMPILE: ${{ inputs.compile }}
      run: |
        set -euo pipefail
        channel="$(sed -n 's/^channel[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' rust-toolchain.toml)"
        if [ -z "${channel}" ]; then
          echo "::error::no channel in rust-toolchain.toml"
          exit 1
        fi
        # --no-self-update keeps the pinned rustup-init's rustup in the container.
        args=(--profile minimal --no-self-update)
        if [ "${COMPILE}" = true ]; then
          args+=(--target wasm32-unknown-unknown)
        fi
        rustup toolchain install "${channel}" "${args[@]}"
        echo "RUSTUP_TOOLCHAIN=${channel}" >> "${GITHUB_ENV}"
        export RUSTUP_TOOLCHAIN="${channel}"
        rustc --version
        cargo --version
        rustup component list --installed

    # Release binaries for the exact pinned versions, each checked against the
    # sha256 in .github/tool-versions.env before it is unpacked; a missing or
    # wrong hash fails the job. tauri-cli and trunk go into $CARGO_HOME/bin,
    # which is on PATH, so `cargo tauri` finds cargo-tauri; wasm-bindgen and
    # wasm-opt into $RUNNER_TEMP/frontend-tools, put first on PATH. The script
    # takes the inputs as COMPILE and BUNDLER and reads the pins file itself.
    - name: Install tauri-cli, trunk, wasm-bindgen and wasm-opt
      shell: bash
      env:
        COMPILE: ${{ inputs.compile }}
        BUNDLER: ${{ inputs.bundler }}
      run: scripts/install-pinned-tools.sh
