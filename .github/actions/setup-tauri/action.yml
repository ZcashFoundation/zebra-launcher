# Installs what `cargo tauri build` / `cargo tauri bundle` need: the tool pins
# from .github/tool-versions.env (loaded into $GITHUB_ENV for the rest of the
# job), the Linux packages (LINUX_PACKAGES, in the ubuntu:22.04 container, as
# root), the Rust toolchain from rust-toolchain.toml, and tauri-cli, plus
# trunk, wasm-bindgen and wasm-opt to compile, at the pinned versions. Used by
# bundle.yml and release.yml; runs after actions/checkout, from the repository
# root.
#
# Rust toolchain: the macOS and Windows runner images ship rustup, so only the
# toolchain is installed. In the ubuntu:22.04 container there is no rustup; it
# is installed from the official rustup-init binary at a pinned version,
# checked against a sha256 recorded here. (actions-rust-lang/setup-rust-toolchain
# would instead pipe the unpinned sh.rustup.rs script into sh when rustup is
# missing, so the container path would depend on whatever that script is on the
# day.) Update RUSTUP_VERSION and both hashes together, from
# https://static.rust-lang.org/rustup/archive/<version>/<triple>/rustup-init.sha256.
#
# tauri-cli, trunk, wasm-bindgen and wasm-opt (binaryen) are their GitHub
# release binaries for the exact pinned versions, checked against the
# per-platform sha256 pins in .github/tool-versions.env. Nothing is compiled
# from crates.io, and nothing is installed without a recorded hash. To
# compile, trunk then runs offline (TRUNK_OFFLINE=true in $GITHUB_ENV), so it
# cannot download its own wasm-bindgen or wasm-opt: it uses the pinned ones on
# PATH, at exactly the versions it requires, or fails.
name: Set up the Tauri toolchain
description: Tool pins from .github/tool-versions.env, Linux packages, Rust toolchain, tauri-cli and (to compile) trunk, wasm-bindgen and wasm-opt.

inputs:
  compile:
    description: '"true" when the job compiles the app (installs trunk, wasm-bindgen and wasm-opt); "false" when it only bundles'
    required: false
    default: "true"

runs:
  using: composite
  steps:
    # KEY=value lines only (no `KEY<<DELIM` multi-line values), with CRs
    # dropped in case a Windows checkout converted line endings.
    - name: Load the tool pins
      shell: bash
      run: |
        set -euo pipefail
        pins="${GITHUB_WORKSPACE}/.github/tool-versions.env"
        while IFS= read -r line || [ -n "${line}" ]; do
          line="${line%$'\r'}"
          case "${line}" in
            '' | '#'*) continue ;;
          esac
          if ! [[ "${line}" =~ ^[A-Z][A-Z0-9_]*= ]]; then
            echo "::error file=.github/tool-versions.env::malformed line: ${line}"
            exit 1
          fi
          printf '%s\n' "${line}" >> "${GITHUB_ENV}"
        done < "${pins}"

    - name: Install Linux packages
      if: runner.os == 'Linux'
      shell: bash
      run: |
        set -euo pipefail
        export DEBIAN_FRONTEND=noninteractive
        apt-get update
        # shellcheck disable=SC2086 # LINUX_PACKAGES is a word list
        apt-get install -y --no-install-recommends ${LINUX_PACKAGES}

    - name: Install rustup (container)
      if: runner.os == 'Linux'
      shell: bash
      env:
        RUSTUP_VERSION: 1.29.2
        RUSTUP_INIT_SHA256_X86_64: 5be191e8c70a5007074254cb74d78dbfdd25cd5a61c27de7b8e5410122ec24f4
        RUSTUP_INIT_SHA256_AARCH64: a9c168dbea81a84671c6b7a5c1795cb0eb699020110d107ddfca427bd797e697
      run: |
        set -euo pipefail
        if command -v rustup > /dev/null 2>&1; then
          echo "rustup is already installed: $(rustup --version 2> /dev/null)"
          exit 0
        fi
        case "$(uname -m)" in
          x86_64) triple=x86_64-unknown-linux-gnu; sha256="${RUSTUP_INIT_SHA256_X86_64}" ;;
          aarch64) triple=aarch64-unknown-linux-gnu; sha256="${RUSTUP_INIT_SHA256_AARCH64}" ;;
          *) echo "::error::no pinned rustup-init for $(uname -m)"; exit 1 ;;
        esac
        init="${RUNNER_TEMP}/rustup-init"
        curl --proto '=https' --tlsv1.2 -sSf -o "${init}" \
          "https://static.rust-lang.org/rustup/archive/${RUSTUP_VERSION}/${triple}/rustup-init"
        echo "${sha256}  ${init}" | sha256sum -c -
        chmod +x "${init}"
        "${init}" -y --no-modify-path --profile minimal --default-toolchain none
        rm -f "${init}"
        echo "${CARGO_HOME:-${HOME}/.cargo}/bin" >> "${GITHUB_PATH}"

    # Only what this job needs: rust-toolchain.toml's channel with the minimal
    # profile, plus the wasm32 target when it compiles the frontend. The
    # file's clippy and rustfmt are for development and the lint jobs, not
    # for building or bundling. RUSTUP_TOOLCHAIN then selects that toolchain
    # for the rest of the job, so rustup does not go back to the toolchain
    # file and install its components after all.
    - name: Install the Rust toolchain
      shell: bash
      env:
        COMPILE: ${{ inputs.compile }}
      run: |
        set -euo pipefail
        channel="$(sed -n 's/^channel[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' rust-toolchain.toml)"
        if [ -z "${channel}" ]; then
          echo "::error::no channel in rust-toolchain.toml"
          exit 1
        fi
        # --no-self-update keeps the pinned rustup-init's rustup in the container.
        args=(--profile minimal --no-self-update)
        if [ "${COMPILE}" = true ]; then
          args+=(--target wasm32-unknown-unknown)
        fi
        rustup toolchain install "${channel}" "${args[@]}"
        echo "RUSTUP_TOOLCHAIN=${channel}" >> "${GITHUB_ENV}"
        export RUSTUP_TOOLCHAIN="${channel}"
        rustc --version
        cargo --version
        rustup component list --installed

    # Release binaries for the exact pinned versions, each checked against the
    # sha256 in .github/tool-versions.env before it is unpacked; a missing or
    # wrong hash fails the job. tauri-cli and trunk go into $CARGO_HOME/bin,
    # which is on PATH, so `cargo tauri` finds cargo-tauri; wasm-bindgen and
    # wasm-opt into $RUNNER_TEMP/frontend-tools, put first on PATH.
    - name: Install tauri-cli, trunk, wasm-bindgen and wasm-opt
      shell: bash
      env:
        COMPILE: ${{ inputs.compile }}
      run: |
        set -euo pipefail
        host="$(rustc -vV | sed -n 's/^host: //p')"
        bin="${CARGO_HOME:-${HOME}/.cargo}/bin"
        work="${RUNNER_TEMP}/tauri-tools"
        rm -rf "${work}"
        mkdir -p "${work}" "${bin}"
        case "${host}" in
          *-windows-*) exe=.exe ;;
          *) exe="" ;;
        esac

        sha256_of() {
          if command -v sha256sum > /dev/null 2>&1; then
            # Read from stdin: with a file operand GNU sha256sum prefixes the hash with
          # a backslash when the path contains one (Windows paths do).
          sha256sum < "$1" | cut -d' ' -f1
          else
            shasum -a 256 < "$1" | cut -d' ' -f1
          fi
        }

        # unpack NAME URL TRIPLE DIR: downloads URL, checks it against
        # <NAME>_SHA256_<TRIPLE> and unpacks it into DIR.
        unpack() {
          local name="$1" url="$2" triple="$3" dir="$4"
          local var want got archive
          var="${name}_SHA256_$(printf '%s' "${triple}" | tr 'a-z-' 'A-Z_')"
          want="${!var:-}"
          if [ -z "${want}" ]; then
            echo "::error::${var} is not in .github/tool-versions.env"
            exit 1
          fi
          archive="${work}/${url##*/}"
          curl --proto '=https' --tlsv1.2 -sSfL --retry 3 -o "${archive}" "${url}"
          got="$(sha256_of "${archive}")"
          if [ "${got}" != "${want}" ]; then
            echo "::error::${url##*/} has sha256 ${got}, expected ${want} (${var})"
            exit 1
          fi
          echo "${url##*/}: sha256 ${got} OK"
          mkdir -p "${dir}"
          case "${archive}" in
            *.zip)
              if command -v 7z > /dev/null 2>&1; then
                7z x -y -o"${dir}" "${archive}" > /dev/null
              else
                unzip -q -o "${archive}" -d "${dir}"
              fi
              ;;
            *) tar -xzf "${archive}" -C "${dir}" ;;
          esac
        }

        # fetch NAME URL TRIPLE BINARY [DEST]: unpack, then installs BINARY
        # (a path inside the archive) into DEST (default ${bin}).
        fetch() {
          local name="$1" url="$2" triple="$3" binary="$4" dest="${5:-${bin}}"
          unpack "${name}" "${url}" "${triple}" "${work}/${name}"
          cp "${work}/${name}/${binary}" "${dest}/${binary##*/}"
          chmod +x "${dest}/${binary##*/}"
        }

        case "${host}" in
          *-linux-*) cli_ext=tgz ;;
          *) cli_ext=zip ;;
        esac
        fetch TAURI_CLI \
          "https://github.com/tauri-apps/tauri/releases/download/tauri-cli-v${TAURI_CLI_VERSION}/cargo-tauri-${host}.${cli_ext}" \
          "${host}" "cargo-tauri${exe}"
        [ "$(cargo tauri --version)" = "tauri-cli ${TAURI_CLI_VERSION}" ] \
          || { echo "::error::cargo tauri --version is '$(cargo tauri --version)', expected tauri-cli ${TAURI_CLI_VERSION}"; exit 1; }
        cargo tauri --version

        if [ "${COMPILE}" = true ]; then
          case "${host}" in
            *-windows-*) trunk_triple="${host}"; trunk_ext=zip ;;
            *-linux-gnu) trunk_triple="${host%-gnu}-musl"; trunk_ext=tar.gz ;;
            *) trunk_triple="${host}"; trunk_ext=tar.gz ;;
          esac
          fetch TRUNK \
            "https://github.com/trunk-rs/trunk/releases/download/v${TRUNK_VERSION}/trunk-${trunk_triple}.${trunk_ext}" \
            "${trunk_triple}" "trunk${exe}"
          [ "$(trunk --version)" = "trunk ${TRUNK_VERSION}" ] \
            || { echo "::error::trunk --version is '$(trunk --version)', expected trunk ${TRUNK_VERSION}"; exit 1; }
          trunk --version

          # wasm-bindgen and wasm-opt for trunk, in a directory of their own
          # put first on PATH. Then trunk runs offline (TRUNK_OFFLINE), so it
          # never downloads them itself: offline it takes a tool from PATH
          # only at exactly the version it requires, else it fails.
          tools="${RUNNER_TEMP}/frontend-tools"
          if command -v cygpath > /dev/null 2>&1; then
            tools="$(cygpath -u "${tools}")"
          fi
          rm -rf "${tools}"
          mkdir -p "${tools}/bin"

          # wasm-bindgen: trunk requires the version of the wasm-bindgen
          # crate in Cargo.lock, which must be the pinned one.
          lock_version="$(scripts/cargo-lock-version.sh wasm-bindgen)" \
            || { echo "::error::cannot read the wasm-bindgen version from Cargo.lock"; exit 1; }
          if [ "${lock_version}" != "${WASM_BINDGEN_VERSION}" ]; then
            echo "::error::Cargo.lock has wasm-bindgen ${lock_version}, but WASM_BINDGEN_VERSION is ${WASM_BINDGEN_VERSION} (.github/tool-versions.env)"
            exit 1
          fi
          case "${host}" in
            *-linux-gnu) wb_triple="${host%-gnu}-musl" ;;
            *) wb_triple="${host}" ;;
          esac
          fetch WASM_BINDGEN \
            "https://github.com/wasm-bindgen/wasm-bindgen/releases/download/${WASM_BINDGEN_VERSION}/wasm-bindgen-${WASM_BINDGEN_VERSION}-${wb_triple}.tar.gz" \
            "${wb_triple}" "wasm-bindgen-${WASM_BINDGEN_VERSION}-${wb_triple}/wasm-bindgen${exe}" "${tools}/bin"

          # wasm-opt: the whole binaryen tree, since on macOS bin/wasm-opt
          # loads lib/libbinaryen.dylib.
          case "${host}" in
            x86_64-unknown-linux-gnu) by_triple=x86_64-linux ;;
            aarch64-unknown-linux-gnu) by_triple=aarch64-linux ;;
            aarch64-apple-darwin) by_triple=arm64-macos ;;
            x86_64-apple-darwin) by_triple=x86_64-macos ;;
            x86_64-pc-windows-msvc) by_triple=x86_64-windows ;;
            *) echo "::error::no pinned binaryen for ${host}"; exit 1 ;;
          esac
          unpack BINARYEN \
            "https://github.com/WebAssembly/binaryen/releases/download/${BINARYEN_VERSION}/binaryen-${BINARYEN_VERSION}-${by_triple}.tar.gz" \
            "${by_triple}" "${tools}"
          binaryen_bin="${tools}/binaryen-${BINARYEN_VERSION}/bin"

          export PATH="${tools}/bin:${binaryen_bin}:${PATH}"
          for dir in "${tools}/bin" "${binaryen_bin}"; do
            if command -v cygpath > /dev/null 2>&1; then
              dir="$(cygpath -w "${dir}")"
            fi
            printf '%s\n' "${dir}" >> "${GITHUB_PATH}"
          done
          # GITHUB_PATH entries come first in later steps, the last one added
          # first of all; check the order trunk will see here too.
          # (Git Bash may report a Windows .exe with or without its suffix.)
          case "$(command -v wasm-bindgen)" in
            "${tools}/bin/wasm-bindgen" | "${tools}/bin/wasm-bindgen${exe}") ;;
            *) echo "::error::wasm-bindgen on PATH is $(command -v wasm-bindgen), not the pinned one"; exit 1 ;;
          esac
          case "$(command -v wasm-opt)" in
            "${binaryen_bin}/wasm-opt" | "${binaryen_bin}/wasm-opt${exe}") ;;
            *) echo "::error::wasm-opt on PATH is $(command -v wasm-opt), not the pinned one"; exit 1 ;;
          esac
          # The version strings exactly as trunk parses them (src/tools.rs).
          wb_version="$(wasm-bindgen --version | tr -d '\r' | cut -d' ' -f2)"
          [ "${wb_version}" = "${WASM_BINDGEN_VERSION}" ] \
            || { echo "::error::wasm-bindgen --version reports ${wb_version}, expected ${WASM_BINDGEN_VERSION}"; exit 1; }
          wo_version="version_$(wasm-opt --version | tr -d '\r' | cut -d' ' -f3)"
          [ "${wo_version}" = "${BINARYEN_VERSION}" ] \
            || { echo "::error::wasm-opt --version reports ${wo_version}, expected ${BINARYEN_VERSION}"; exit 1; }
          wasm-bindgen --version
          wasm-opt --version
          {
            echo "TRUNK_OFFLINE=true"
            echo "TRUNK_TOOLS_WASM_OPT=${BINARYEN_VERSION}"
          } >> "${GITHUB_ENV}"
        fi
        rm -rf "${work}"
