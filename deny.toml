# cargo-deny configuration: https://embarkstudios.github.io/cargo-deny/
[graph]
all-features = true

[advisories]
yanked = "deny"
# Unmaintained crates pulled in by dependencies we cannot upgrade ourselves.
# Revisit on every Tauri and Leptos bump.
ignore = [
    # `paste` is unmaintained; it is a compile-time proc macro pulled in by Leptos
    # (`either_of`, `tachys`). Drop this once Leptos moves off it.
    { id = "RUSTSEC-2024-0436", reason = "unmaintained proc macro, transitive via leptos" },
    # proc-macro-error: build-time only, via gtk-rs 0.18 (glib-macros, gtk3-macros).
    { id = "RUSTSEC-2024-0370", reason = "transitive through Tauri's gtk-rs 0.18; no safe upgrade" },
    # zvariant, zbus_names, zvariant_derive: merged into zbus 6; used through
    # zbus 5 by tauri-plugin-opener and tauri-plugin-single-instance on Linux.
    { id = "RUSTSEC-2026-0370", reason = "transitive through zbus 5 in Tauri plugins; fixed by their move to zbus 6" },
    { id = "RUSTSEC-2026-0371", reason = "transitive through zbus 5 in Tauri plugins; fixed by their move to zbus 6" },
    { id = "RUSTSEC-2026-0372", reason = "transitive through zbus 5 in Tauri plugins; fixed by their move to zbus 6" },
]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "MPL-2.0",
    "CC0-1.0",
    "Unlicense",
]
confidence-threshold = 0.8

# The Mozilla CA root list (`webpki-root-certs`), via reqwest's rustls
# platform verifier in tauri-plugin-updater. A permissive data licence.
[[licenses.exceptions]]
crate = "webpki-root-certs"
allow = ["CDLA-Permissive-2.0"]

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
