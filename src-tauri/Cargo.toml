[package]
name = "zebra-launcher"
description = "Zebra Launcher: a desktop app that runs and supervises zebrad"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
default-run = "zebra-launcher"

[lib]
name = "zebra_launcher"
path = "src/lib.rs"

[[bin]]
name = "zebra-launcher"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
launcher-core = { workspace = true }
launcher-types = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tauri = { version = "2.12", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-process = "2"
tauri-plugin-single-instance = "2"
thiserror = { workspace = true }
tokio = { workspace = true, features = ["sync", "time", "macros"] }
tracing = { workspace = true }
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", default-features = false, features = [
    "env-filter",
    "fmt",
    "ansi",
    "std",
] }

[dev-dependencies]
serde_json = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["rt", "macros", "time"] }

[lints]
workspace = true
