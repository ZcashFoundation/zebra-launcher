<!doctype html>
<!-- ZEAL DEVELOPMENT FALLBACK: CI replaces this file with Zebra's pinned stable mdBook. -->
<html lang="en">
<head>
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; base-uri 'none'; connect-src 'self'; font-src 'self' data:; form-action 'none'; frame-src 'none'; img-src 'self' data:; media-src 'none'; object-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; worker-src 'none'">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Zebra stable book — development fallback</title>
  <style>
    :root { color-scheme: light; --bg: #fff; --fg: #202124; --muted: #5f6368; }
    :root[data-theme="dark"] { color-scheme: dark; --bg: #151719; --fg: #e8eaed; --muted: #aeb4bc; }
    @media (prefers-color-scheme: dark) { :root:not([data-theme]) { color-scheme: dark; --bg: #151719; --fg: #e8eaed; --muted: #aeb4bc; } }
    body { max-width: 52rem; margin: 0 auto; padding: 2rem; background: var(--bg); color: var(--fg); font: 16px/1.55 system-ui, sans-serif; }
    .notice { color: var(--muted); }
  </style>
  <script>(() => { const t = new URLSearchParams(location.search).get("theme"); if (t === "light" || t === "dark") document.documentElement.dataset.theme = t; })();</script>
</head>
<body>
  <main>
    <h1>Zebra stable book</h1>
    <p class="notice"><strong>Development fallback.</strong> The full offline book is generated at the pinned stable Zebra commit in CI.</p>
    <p>This placeholder keeps <code>cargo tauri dev</code> functional. Bundle workflows replace it with the generated <code>zebra-docs</code> artifact.</p>
  </main>
</body>
</html>
