[package]
name = "ui"
description = "The Zebra Launcher user interface (Leptos, client-side rendered, built with trunk)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
launcher-types = { workspace = true }
leptos = { version = "0.8", features = ["csr"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
    "Clipboard",
    "Document",
    "DomRect",
    "Element",
    "HtmlElement",
    "HtmlInputElement",
    "HtmlSelectElement",
    "Location",
    "MediaQueryList",
    "MediaQueryListEvent",
    "Navigator",
    "ResizeObserver",
    "Storage",
    "SvgElement",
    "Window",
] }
serde = { workspace = true }
serde-wasm-bindgen = "0.6"
toml_edit = { workspace = true }
console_error_panic_hook = "0.1"

[lints]
workspace = true
