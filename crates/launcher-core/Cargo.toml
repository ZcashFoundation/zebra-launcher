[package]
name = "launcher-core"
description = "Zeal logic that does not depend on Tauri: zebrad supervision, logs, config, paths"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
launcher-types = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml_edit = { workspace = true }
reqwest = { workspace = true }
base64 = { workspace = true }
dirs = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = [
    "rt-multi-thread",
    "macros",
    "process",
    "io-util",
    "sync",
    "time",
    "signal",
    "net",
    "fs",
] }
tracing = { workspace = true }

[target.'cfg(unix)'.dependencies]
# "feature": sysconf (CLK_TCK and _NPROCESSORS_ONLN), for the Linux resource reader.
nix = { workspace = true, features = ["signal", "process", "fs", "feature"] }

[target.'cfg(target_os = "macos")'.dependencies]
# Already in the tree through tokio; used for `proc_pidpath`.
libc = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_Storage_FileSystem",
] }

[dev-dependencies]
tempfile = { workspace = true }
# `test-util`: paused clocks for the updater's 6-hour schedules.
tokio = { workspace = true, features = ["test-util"] }

[[bin]]
name = "fake-zebrad"
path = "src/bin/fake-zebrad.rs"

[lints]
workspace = true
