# Zingod daemon configuration
#
# Generated with `zingod generate-config`.
#
# Layered highest-priority-first: ZINGOD_CONFIG_ env vars, then this file, then defaults.
# For documentation see https://github.com/zingolabs/zingod
network = "mainnet"
validator_client = "legacy_rpc"

[metrics]

[[trusted_validators]]
jsonrpc_address = "127.0.0.1:8232"
connect_timeout_secs = 2
read_timeout_secs = 30
max_connections = 32
max_response_mib = 32
priority = 0

[serve]
grpc_listen_address = "127.0.0.1:8137"
max_address_rows = 100000
state_dir = "<HOME>/.local/share/zingod/state"
hold_goaway_delay_secs = 0

[grpc]
max_connections = 4096
max_connections_per_ip = 128
max_streams_per_connection = 100
max_work_streams = 2048
max_subscriptions = 4096
max_point_reads = 64
max_range_reads = 32
max_scan_reads = 4
unread_timeout_secs = 300
silent_timeout_secs = 300
max_connection_age_secs = 1800
max_connection_age_grace_secs = 600
max_connection_idle_secs = 1800
adaptive_work_streams = true
trusted_proxies = []
shutdown_grace_secs = 10

[grpc.overload]
cpu_pressure_percent = 25
io_pressure_percent = 25

[submission]
propagation_threshold_secs = 15
max_attempts = 4

[p2p]
enabled = false
peer_target = 8
initial_peers = []
cache_dir = "<HOME>/.cache/zingod/peers"

[sync]
finalised_depth = 1000
concurrency = 32
queue_mib = 256

[sync.lsm_store]
fanout = 16
merge_slots = 4
merge_mib_per_sec = 200

[index.compact_block]
enabled = true
path = "<HOME>/.local/share/zingod/indexes/compact_block"

[index.block_hash]
enabled = true
path = "<HOME>/.local/share/zingod/indexes/block_hash"

[index.tree_state]
enabled = true
path = "<HOME>/.local/share/zingod/indexes/tree_state"

[index.transparent_address]
enabled = true
path = "<HOME>/.local/share/zingod/indexes/transparent_address"

[index.txid_location]
enabled = true
path = "<HOME>/.local/share/zingod/indexes/txid_location"
