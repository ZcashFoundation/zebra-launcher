# Prometheus + Grafana for a zebrad run by Zebra Launcher. README.md in this directory
# is the guide (start, stop, update, checks, where the data lives, dashboards, known
# gaps); the launcher's Grafana tab is described in docs/GRAFANA.md and problems in
# docs/TROUBLESHOOTING.md.
#
# The launcher binds zebrad's metrics to 127.0.0.1:9999. A container on the Docker
# bridge cannot reach a host port bound to 127.0.0.1, so:
#   - Docker Desktop (macOS, Windows): use this file as is. Prometheus scrapes
#     host.docker.internal:9999 (not yet verified to reach a 127.0.0.1-bound port on
#     those systems; see README.md).
#   - Linux (Docker Engine): add docker-compose.linux.yml, which puts Prometheus and
#     Grafana on the host network.
#
#   docker compose -f docs/observability/docker-compose.yml up -d
#   docker compose -f docs/observability/docker-compose.yml -f docs/observability/docker-compose.linux.yml up -d
#
# Grafana: http://127.0.0.1:3000 (anonymous Viewer; admin/admin to edit), which is also
# the URL to set in the launcher (Grafana tab or Settings); the launcher builds the
# dashboard URLs itself. Prometheus: http://127.0.0.1:9090.
#
# Both services carry a health check, and Grafana waits for Prometheus to pass its
# check before it starts, so the datasource is reachable when the dashboards are
# provisioned. `docker compose ps` shows the state as (healthy); `docker compose up`
# fails with "dependency failed to start" when Prometheus never becomes healthy.
# The checks probe 127.0.0.1, which answers in both layouts: on the bridge the
# services listen on all of the container's interfaces, on the Linux host network they
# are bound to 127.0.0.1 only (and busybox wget takes only the first address a name
# such as localhost resolves to).

name: zebra-launcher-observability

services:
  prometheus:
    image: prom/prometheus:v3.15.1
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:9090:9090"
    # /-/ready answers 200 once the configuration is loaded and the TSDB is open. The
    # image is built on busybox, which has wget but no curl.
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9090/-/ready"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  grafana:
    image: grafana/grafana:13.2.4
    restart: unless-stopped
    depends_on:
      prometheus:
        condition: service_healthy
    environment:
      # Read by grafana/provisioning/datasources/datasources.yml.
      PROMETHEUS_URL: http://prometheus:9090
      # The launcher embeds the dashboards in an iframe.
      GF_SECURITY_ALLOW_EMBEDDING: "true"
      # Viewing needs no login; editing still does. The admin password comes from
      # GF_SECURITY_ADMIN_PASSWORD in a .env file next to this file (git-ignored), read
      # by Compose for the ${...} below; without one it is admin. Grafana applies it
      # when its database is created, so it only counts at the first start.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_AUTH_DISABLE_LOGIN_FORM: "false"
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD:-admin}
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/zebra_overview.json
      # A local desktop stack has no reason to phone home.
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "127.0.0.1:3000:3000"
    # /api/health answers 200 once the database migrations have run and Grafana serves
    # requests. The image is built on Alpine and ships curl. Grafana's first start
    # (migrations, provisioning) takes longer than Prometheus's, hence the start period.
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  prometheus-data:
  grafana-data:
