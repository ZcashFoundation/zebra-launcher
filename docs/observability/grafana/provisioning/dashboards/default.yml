apiVersion: 1

providers:
  - name: Zebra Dashboards
    orgId: 1
    folder: Zebra
    folderUid: zebra-dashboards
    type: file
    disableDeletion: true
    # The JSON files are vendored from Zebra; edits made in the UI are not saved back.
    allowUiUpdates: false
    updateIntervalSeconds: 30
    options:
      path: /var/lib/grafana/dashboards
